<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f2f2f7" />
  <title>每月零件紀錄</title>
  <style>
    :root {
      --bg: #f2f2f7;
      --card: rgba(255, 255, 255, 0.85);
      --card-solid: #ffffff;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --line: rgba(60, 60, 67, 0.12);
      --accent: #007aff;
      --good: #34c759;
      --danger: #ff3b30;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      --topbar-h: 125px;
      --safe-top: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
    
    /* 針對 iPhone 頂部安全區域留白 */
    body { padding: calc(var(--topbar-h) + var(--safe-top) + 16px) 12px calc(env(safe-area-inset-bottom, 0px) + 20px); }
    
    h1 { margin: 0 0 12px; text-align: center; font-size: 22px; font-weight: 700; color: #000; }
    
    /* 固定頂部面板 */
    .topbar { position: fixed; left: 0; right: 0; top: 0; z-index: 1000; padding: calc(var(--safe-top) + 10px) 12px 10px; background: rgba(242, 242, 247, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
    .summary { background: var(--card-solid); border-radius: 16px; box-shadow: var(--shadow); padding: 12px; border: 1px solid rgba(60, 60, 67, 0.05); }
    .summary-title { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .summary-item { border-radius: 12px; padding: 8px; min-height: 52px; display: flex; flex-direction: column; justify-content: center; text-align: center; }
    .summary-item span { font-size: 11px; font-weight: 500; color: var(--muted); margin-bottom: 2px; }
    .summary-item strong { font-size: 16px; font-weight: 700; }
    .summary-item.total { background: rgba(0, 122, 255, 0.06); } .summary-item.total strong { color: var(--accent); }
    .summary-item.hkd { background: rgba(255, 149, 0, 0.08); } .summary-item.hkd strong { color: #ff9500; }
    .summary-item.profit { background: rgba(52, 199, 89, 0.08); } .summary-item.profit strong { color: var(--good); }
    
    /* 控制按鈕區 */
    .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .controls input[type="month"] { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); font-size: 17px; padding: 10px 12px; background: var(--card-solid); color: #000; text-align: center; -webkit-appearance: none; }
    .action-row { display: flex; gap: 10px; }
    .action-row button { flex: 1; min-height: 46px; border-radius: 12px; font-size: 16px; font-weight: 600; border: none; cursor: pointer; }
    .btn-add { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(0,122,255,0.2); }
    .btn-sheet { background: rgba(142, 142, 147, 0.15); color: var(--text); }
    
    /* RWD 表格與 iPhone 卡片流式佈局 */
    .table-wrap { width: 100%; }
    table { width: 100%; border-collapse: collapse; background: transparent; }
    thead { display: table-header-group; }
    thead th { background: rgba(60, 60, 67, 0.04); color: var(--muted); padding: 12px 8px; font-size: 13px; font-weight: 600; text-align: right; border-bottom: 1px solid var(--line); }
    thead th:nth-child(1), thead th:nth-child(2) { text-align: left; }
    
    tr { background: var(--card-solid); border-bottom: 1px solid var(--line); }
    td { padding: 12px 8px; font-size: 16px; text-align: right; color: var(--text); }
    td:nth-child(1), td:nth-child(2) { text-align: left; }
    
    /* 輸入框優化 (適合 iOS 點擊) */
    input[type="text"], input[type="number"] { width: 100%; border: 1px solid transparent; background: transparent; padding: 6px; font-size: 16px; color: var(--text); text-align: right; outline: none; border-radius: 6px; }
    td:nth-child(1) input, td:nth-child(2) input { text-align: left; }
    input:focus { background: #f2f2f7; border-color: rgba(0,122,255,0.2); }
    
    .calculated { font-weight: 600; }
    .rmb-cell { color: var(--accent); }
    .cost-cell { color: #ff9500; }
    .profit-cell { color: var(--good); font-weight: 700; }
    .delete-btn { background: rgba(255, 59, 48, 0.08); color: var(--danger); border: none; padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; }
    .saving-status { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); background: rgba(0, 0, 0, 0.8); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 14px; display: none; z-index: 2000; backdrop-filter: blur(4px); }
    .empty-row { text-align: center !important; padding: 40px 16px !important; color: var(--muted); font-size: 15px; background: transparent !important; }

    /* 📱 核心關鍵：針對 iPhone / 手機螢幕全面改為「卡片式清單」，絕不走位 */
    @media (max-width: 768px) {
      thead { display: none; } /* 隱藏傳統表頭 */
      tbody { display: flex; flex-direction: column; gap: 12px; }
      tr { display: block; border: 1px solid var(--line); border-radius: 16px; padding: 8px 4px; box-shadow: var(--shadow); overflow: hidden; }
      td { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; font-size: 15px; border-bottom: 1px solid rgba(60, 60, 67, 0.05); text-align: right; min-height: 44px; }
      td:last-child { border-bottom: none; justify-content: center; padding-top: 12px; }
      
      /* 透過 ::before 顯示欄位名稱，確保左文字、右輸入框完美對齊 */
      td::before { content: attr(data-label); font-weight: 600; color: #3a3a3c; text-align: left; min-width: 100px; font-size: 14px; }
      
      input[type="text"], input[type="number"] { background: #f2f2f7; border: 1px solid transparent; padding: 6px 10px; border-radius: 8px; max-width: 60%; font-size: 15px; }
      input:focus { background: #e5e5ea; }
      .delete-btn { width: 100%; min-height: 38px; font-size: 15px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="summary">
      <div class="summary-title">本月總覽</div>
      <div class="summary-grid">
        <div class="summary-item total"><span>人民幣(總)</span><strong id="summaryTotal">¥0</strong></div>
        <div class="summary-item hkd"><span>成本(人民幣)</span><strong id="summaryHkd">¥0</strong></div>
        <div class="summary-item profit"><span>賺取(港幣)</span><strong id="summaryProfit">$0</strong></div>
      </div>
    </div>
  </div>

  <h1>每月零件紀錄表</h1>

  <div class="controls">
    <input type="month" id="monthSelect" onchange="loadData()" />
    <div class="action-row">
      <button class="btn-add" onclick="addRow()">➕ 新增項目</button>
      <button class="btn-sheet" onclick="openSheet()">📊 開啟試算表</button>
    </div>
  </div>

  <div class="table-wrap">
    <table id="dataTable">
      <thead>
        <tr>
          <th>年份月份</th>
          <th>貨名</th>
          <th>價錢</th>
          <th>數量</th>
          <th>人民幣</th>
          <th>成本</th>
          <th>成本人民幣</th>
          <th>賺取(港幣)</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="savingStatus" class="saving-status">💾 自動儲存中...</div>

  <script>
    let localDataCached = [];
    let selectedMonthValue = ""; 
    // 🌟 你的原有後端網址
    const webAppUrl = "https://script.google.com/macros/s/AKfycbz5q4zQLBg16QKrbBU1q7I5QwVyRUwMKX6k3CCa3mqGLRotnG9OWVSt6Z8L2ZUpxPHB/exec";
    const exchangeRate = 1.1;

    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function formatMoney(value) {
      const n = Number(value) || 0;
      return n.toFixed(2).replace(/\.?0+$/, "");
    }

    function updateSummary(totalSum, totalCost, totalProfit) {
      document.getElementById("summaryTotal").innerText = `¥${formatMoney(totalSum)}`;
      document.getElementById("summaryHkd").innerText = `¥${formatMoney(totalCost)}`;
      document.getElementById("summaryProfit").innerText = `$${formatMoney(totalProfit)}`;
    }

    async function loadData() {
      selectedMonthValue = document.getElementById("monthSelect").value;
      if (!selectedMonthValue) return;

      const tbody = document.querySelector("#dataTable tbody");
      tbody.innerHTML = `<tr><td colspan="9" class="empty-row">🔄 正在讀取 ${selectedMonthValue} 的資料...</td></tr>`;
      updateSummary(0, 0, 0);

      try {
        const res = await fetch(webAppUrl + "?targetMonth=" + encodeURIComponent(selectedMonthValue));
        const result = await res.json();

        if (result.success && Array.isArray(result.data) && result.data.length > 0) {
          localDataCached = result.data;
          renderInterface();
        } else {
          localDataCached = [];
          tbody.innerHTML = `<tr><td colspan="9" class="empty-row">📅 ${selectedMonthValue} 無符合的月份紀錄</td></tr>`;
        }
      } catch (error) {
        console.error("讀取失敗:", error);
        tbody.innerHTML = `<tr><td colspan="9" class="empty-row">❌ 讀取失敗</td></tr>`;
      }
    }

    function renderInterface() {
      const tbody = document.querySelector("#dataTable tbody");
      tbody.innerHTML = "";

      let totalSum = 0; let totalCost = 0; let totalProfit = 0;

      localDataCached.forEach((item, index) => {
        const date = escapeHtml(item.date || "");
        const name = escapeHtml(item.name || "");
        const price = Number(item.price) || 0;
        const qty = Number(item.qty) || 0;
        const cost = Number(item.cost) || 0;

        const totalRmb = price * qty;
        const costRmb = cost * qty;
        const profitHkd = (totalRmb - costRmb) * exchangeRate;

        totalSum += totalRmb;
        totalCost += costRmb;
        totalProfit += profitHkd;

        const tr = document.createElement("tr");
        // 🌟 重新校準精準對齊的 data-label 屬性，確保手機版完美渲染不歪斜
        tr.innerHTML = `
          <td data-label="年份月份"><input type="text" value="${date}" onchange="updateField(${index}, 'date', this.value)"></td>
          <td data-label="貨名"><input type="text" value="${name}" onchange="updateField(${index}, 'name', this.value)"></td>
          <td data-label="價錢"><input type="number" value="${price}" onchange="updateField(${index}, 'price', this.value)"></td>
          <td data-label="數量"><input type="number" value="${qty}" onchange="updateField(${index}, 'qty', this.value)"></td>
          <td data-label="人民幣(總)" class="calculated rmb-cell">¥${formatMoney(totalRmb)}</td>
          <td data-label="成本(單個)"><input type="number" value="${cost}" onchange="updateField(${index}, 'cost', this.value)"></td>
          <td data-label="成本(人民幣)" class="calculated cost-cell">¥${formatMoney(costRmb)}</td>
          <td data-label="賺取(港幣)" class="calculated profit-cell">$${formatMoney(profitHkd)}</td>
          <td data-label="操作"><button class="delete-btn" onclick="deleteRecord(${item.row})">刪除</button></td>
        `;
        tbody.appendChild(tr);
      });

      updateSummary(totalSum, totalCost, totalProfit);
    }

    function updateField(dataIndex, field, value) {
      const item = localDataCached[dataIndex];
      item[field] = value;
      renderInterface();

      const statusEl = document.getElementById("savingStatus");
      statusEl.innerText = "💾 自動儲存中...";
      statusEl.style.display = "block";

      fetch(webAppUrl + "?action=update&row=" + item.row + "&field=" + field + "&value=" + encodeURIComponent(value), {
        method: "POST",
        mode:
