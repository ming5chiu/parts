<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每月進銷存</title>
    <style>
        body { 
            font-family: "Microsoft JhengHei", "Segoe UI", sans-serif; 
            background: #f4f6f9; 
            padding: 20px; 
            position: relative;
        }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 10px; }
        .controls { 
            text-align: center; 
            margin: 20px 0; 
        }
        .controls button { 
            padding: 10px 16px; 
            margin: 0 8px; 
            font-size: 15px;
            cursor: pointer;
        }
        table { 
            width: 100%; 
            max-width: 1350px; 
            margin: 0 auto; 
            border-collapse: collapse; 
            background: white; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
        }
        th { 
            background: #2c3e50; 
            color: white; 
            padding: 12px 10px; 
            text-align: center; 
        }
        td { 
            padding: 10px 8px; 
            border-bottom: 1px solid #eee; 
            text-align: right; 
        }
        td:first-child, th:first-child { text-align: left; }

        /* 行深淺色交替 */
        tbody tr:nth-child(odd) { background-color: #ffffff; }
        tbody tr:nth-child(even) { background-color: #f0f4f8; }

        input { 
            width: 100%; 
            border: none; 
            background: transparent; 
            text-align: right; 
            font-size: 15px;
            padding: 6px 4px;
        }
        input:focus { 
            background: #fffacd; 
            outline: 2px solid #3498db; 
        }
        .calculated { 
            background: #e8f4fc; 
            font-weight: bold; 
        }
        .profit-cell {
            background: #d4f4e0 !important;
            font-weight: bold;
            color: #1e8449;
        }
        .total-row { 
            background: #2c3e50; 
            color: #f1c40f; 
            font-weight: bold; 
            font-size: 1.25em; 
        }
        .profit-total { 
            background: #27ae60; 
            color: white; 
            font-weight: bold; 
            font-size: 1.35em; 
        }
        button.delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .save-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-size: 16px;
            z-index: 100;
        }
    </style>
</head>
<body>

<h1>每月進銷存統計表</h1>

<div class="controls">
    <label>選擇月份：</label>
    <input type="month" id="monthSelect" onchange="loadMonth()" style="padding:8px;">
    <button onclick="addRow()">➕ 新增項目</button>
    <button onclick="exportCSV()">📥 匯出 CSV</button>
    <button onclick="clearMonth()">🗑 清空本月</button>
</div>

<table id="dataTable">
    <thead>
        <tr>
            <th>日期</th>
            <th>ITEM</th>
            <th>價錢</th>
            <th>數量</th>
            <th>總數</th>
            <th>成本</th>
            <th>港幣</th>
            <th>賺取</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody></tbody>
    <tfoot>
        <tr class="total-row" id="totalRow">
            <td colspan="4"><strong>Total</strong></td>
            <td id="totalAmount">0</td>
            <td></td>
            <td id="totalHKD">$0</td>
            <td id="totalProfit" class="profit-total">$0</td>
            <td></td>
        </tr>
    </tfoot>
</table>

<button class="save-btn" onclick="saveData()">💾 儲存本月資料</button>

<script>
let currentMonth = '';

window.onload = () => {
    const today = new Date();
    const defaultMonth = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2, '0');
    document.getElementById('monthSelect').value = defaultMonth;
    currentMonth = defaultMonth;
    loadMonth();
};

function loadMonth() {
    currentMonth = document.getElementById('monthSelect').value;
    const tbody = document.querySelector('#dataTable tbody');
    tbody.innerHTML = '';
    
    const data = JSON.parse(localStorage.getItem('inventory_' + currentMonth) || '[]');
    data.forEach((item, index) => addRowToTable(item, index));
    updateTotals();
}

function addRow() {
    const item = { date: 'May-26', name: '', price: 0, qty: 0, cost: 0 };
    const index = document.querySelectorAll('tbody tr').length;
    addRowToTable(item, index);
}

function addRowToTable(item, index) {
    const tbody = document.querySelector('#dataTable tbody');
    const row = document.createElement('tr');
    
    const total = Math.round(item.price * item.qty);
    const hkd = Math.round(item.qty * item.cost);
    const profit = total - hkd;
    
    row.innerHTML = `
        <td><input type="text"   value="${item.date || 'May-26'}" onchange="updateCell(${index}, 'date', this)" onkeydown="handleKey(event, ${index}, this)"></td>
        <td><input type="text"   value="${item.name}" onchange="updateCell(${index}, 'name', this)" onkeydown="handleKey(event, ${index}, this)"></td>
        <td><input type="number" step="1" value="${Math.round(item.price)}" onchange="updateCell(${index}, 'price', this)" onkeydown="handleKey(event, ${index}, this)"></td>
        <td><input type="number" step="1" value="${Math.round(item.qty)}" onchange="updateCell(${index}, 'qty', this)" onkeydown="handleKey(event, ${index}, this)"></td>
        <td class="calculated">¥${total}</td>
        <td><input type="number" step="1" value="${Math.round(item.cost)}" onchange="updateCell(${index}, 'cost', this)" onkeydown="handleKey(event, ${index}, this)"></td>
        <td class="calculated">$${hkd}</td>
        <td class="calculated profit-cell">$${profit}</td>
        <td><button class="delete-btn" onclick="deleteRow(${index})">刪除</button></td>
    `;
    tbody.appendChild(row);
}

function updateCell(rowIndex, field, input) {
    let data = JSON.parse(localStorage.getItem('inventory_' + currentMonth) || '[]');
    if (!data[rowIndex]) data[rowIndex] = {};
    
    data[rowIndex][field] = (field === 'name' || field === 'date') 
        ? input.value 
        : Math.round(parseFloat(input.value) || 0);
    
    localStorage.setItem('inventory_' + currentMonth, JSON.stringify(data));
    loadMonth();
}

// 加強鍵盤控制（類似 Excel / Google Sheets）
function handleKey(e, rowIndex, input) {
    const currentCell = input.parentElement;
    const currentRow = currentCell.parentElement;
    const allRows = document.querySelectorAll('tbody tr');
    const cellIndex = Array.from(currentRow.children).indexOf(currentCell);

    switch (e.key) {
        case "Enter":
            e.preventDefault();
            if (rowIndex < allRows.length - 1) {
                // 跳到下一行同欄位
                const nextRow = allRows[rowIndex + 1];
                const nextInput = nextRow.children[cellIndex].querySelector('input');
                if (nextInput) nextInput.focus();
            } else {
                // 最後一行 → 新增一行
                addRow();
                setTimeout(() => {
                    const newRow = document.querySelectorAll('tbody tr').item(-1);
                    const newInput = newRow.children[cellIndex].querySelector('input');
                    if (newInput) newInput.focus();
                }, 10);
            }
            break;

        case "Tab":
            // Tab 由瀏覽器預設處理即可（同一行左右移動）
            // 如果需要更精細控制可在此擴充
            break;

        case "ArrowDown":
            e.preventDefault();
            if (rowIndex < allRows.length - 1) {
                const nextRow = allRows[rowIndex + 1];
                const nextInput = nextRow.children[cellIndex].querySelector('input');
                if (nextInput) nextInput.focus();
            }
            break;

        case "ArrowUp":
            e.preventDefault();
            if (rowIndex > 0) {
                const prevRow = allRows[rowIndex - 1];
                const prevInput = prevRow.children[cellIndex].querySelector('input');
                if (prevInput) prevInput.focus();
            }
            break;
    }
}

function deleteRow(index) {
    if (!confirm('確定刪除此項目？')) return;
    let data = JSON.parse(localStorage.getItem('inventory_' + currentMonth) || '[]');
    data.splice(index, 1);
    localStorage.setItem('inventory_' + currentMonth, JSON.stringify(data));
    loadMonth();
}

function updateTotals() {
    let data = JSON.parse(localStorage.getItem('inventory_' + currentMonth) || '[]');
    let sumTotal = 0, sumHKD = 0, sumProfit = 0;
    
    data.forEach(item => {
        const total = Math.round(item.price * (item.qty || 0));
        const hkd = Math.round((item.qty || 0) * (item.cost || 0));
        const profit = total - hkd;
        sumTotal += total;
        sumHKD += hkd;
        sumProfit += profit;
    });
    
    document.getElementById('totalAmount').textContent = '¥' + sumTotal;
    document.getElementById('totalHKD').textContent = '$' + sumHKD;
    document.getElementById('totalProfit').textContent = '$' + sumProfit;
}

function saveData() { alert('✅ 資料已儲存！\n月份：' + currentMonth); }
function exportCSV() { /* ... */ 
    let data = JSON.parse(localStorage.getItem('inventory_' + currentMonth) || '[]');
    if (data.length === 0) return alert('沒有資料');
    let csv = "日期,ITEM,價錢,數量,總數,成本,港幣,賺取\n";
    data.forEach(item => {
        const total = Math.round(item.price * (item.qty || 0));
        const hkd = Math.round((item.qty || 0) * (item.cost || 0));
        const profit = total - hkd;
        csv += `"${item.date || ''}","${item.name || ''}",${item.price || 0},${item.qty || 0},${total},${item.cost || 0},${hkd},${profit}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `進銷存_${currentMonth}.csv`;
    link.click();
}
function clearMonth() {
    if (confirm(`確定清空 ${currentMonth} 所有資料？`)) {
        localStorage.removeItem('inventory_' + currentMonth);
        loadMonth();
    }
}
</script>

</body>
</html>
