<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>每月零件紀錄</title>
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png" />

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #fff;
      --text: #1f2d3d;
      --muted: #6b7c93;
      --line: #e6ebf2;
      --accent: #2d8cff;
      --good: #1f9d55;
      --shadow: 0 6px 18px rgba(0,0,0,.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    h1 {
      margin: 6px 0 12px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .controls input[type="month"],
    .controls button {
      width: 100%;
      min-height: 46px;
      border-radius: 12px;
      border: 1px solid #d6dde7;
      font-size: 16px;
      padding: 11px 14px;
      background: #fff;
      color: var(--text);
      -webkit-appearance: none;
    }

    .action-row {
      display: flex;
      gap: 10px;
    }

    .action-row button {
      flex: 1;
      font-weight: 600;
      background: #eef3f8;
    }

    .action-row button:active {
      background: #dfe8f2;
    }

    .summary {
      background: linear-gradient(180deg, #fff, #f8fbff);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 12px;
      margin-bottom: 12px;
    }

    .summary-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .summary-item {
      background: #f7f9fc;
      border: 1px solid #e7edf4;
      border-radius: 14px;
      padding: 10px 12px;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .summary-item span {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .summary-item strong {
      font-size: 20px;
      line-height: 1.1;
    }

    .profit strong { color: var(--good); }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      min-width: 780px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      background: #2f4156;
      color: #fff;
      padding: 12px 6px;
      font-size: 14px;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    td {
      padding: 10px 6px;
      border-bottom: 1px solid #edf1f5;
      font-size: 15px;
      text-align: right;
    }

    th:nth-child(2),
    td:nth-child(2) {
      text-align: left;
      padding-left: 10px;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 8px;
      padding: 8px 6px;
      font-size: 16px;
      color: var(--text);
      text-align: right;
    }

    td:nth-child(2) input[type="text"] { text-align: left; }

    input:focus {
      outline: none;
      border-color: var(--accent);
      background: #fffdf0;
    }

    .calculated {
      background: #f8fbfd;
      font-weight: 700;
    }

    .profit {
      background: #ebfbf2;
      color: var(--good);
      font-weight: 700;
    }

    .delete-btn {
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    .saving-status {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 12px;
      background: rgba(0,0,0,.75);
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      display: none;
      z-index: 999;
    }

    .empty-row {
      text-align: center;
      padding: 30px !important;
      color: #7f8c8d;
    }

    @media (max-width: 820px) {
      body { padding: 10px; }
      h1 { font-size: 20px; }

      .summary-grid { gap: 8px; }
      .summary-item { min-height: 64px; padding: 9px 10px; }
      .summary-item strong { font-size: 18px; }

      .table-wrap {
        overflow: visible;
        border: none;
        background: transparent;
        box-shadow: none;
      }

      table { min-width: 0; width: 100%; }
      thead { display: none; }
      tbody, tr, td { display: block; width: 100%; }

      tr {
        margin-bottom: 10px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 4px 12px rgba(0,0,0,.04);
      }

      td {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-bottom: 1px solid #eef2f6;
        text-align: left;
      }

      td:last-child { border-bottom: none; }

      td::before {
        content: attr(data-label);
        font-weight: 700;
        color: #516173;
        min-width: 72px;
      }

      td input {
        flex: 1;
        min-width: 0;
        background: #f9fbfd;
        border: 1px solid #dbe3ea;
        border-radius: 10px;
        padding: 8px 10px;
      }

      .calculated, .profit { background: transparent; }
    }
  </style>
</head>

<body>
  <h1>每月零件紀錄表</h1>

  <div class="controls">
    <input type="month" id="monthSelect" onchange="loadData()" />
    <div class="action-row">
      <button onclick="addRow()">➕ 新增項目</button>
      <button onclick="openSheet()">📊 開啟 Google Sheet</button>
    </div>
  </div>

  <div class="summary">
    <div class="summary-title">本月總覽</div>
    <div class="summary-grid">
      <div class="summary-item">
        <span>總數</span>
        <strong id="summaryTotal">¥0</strong>
      </div>
      <div class="summary-item">
        <span>港幣</span>
        <strong id="summaryHkd">$0</strong>
      </div>
      <div class="summary-item profit">
        <span>賺取</span>
        <strong id="summaryProfit">$0</strong>
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <table id="dataTable">
      <thead>
        <tr>
          <th>日期</th>
          <th>貨名</th>
          <th>價錢</th>
          <th>數量</th>
          <th>總數</th>
          <th>成本</th>
          <th>港幣</th>
          <th>賺取</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="savingStatus" class="saving-status">💾 自動儲存中...</div>

  <script>
    let currentMonth = '';
    let localDataCached = [];

    const webAppUrl = "https://script.google.com/macros/s/AKfycbz5q4zQLBg16QKrbBU1q7I5QwVyRUwMKX6k3CCa3mqGLRotnG9OWVSt6Z8L2ZUpxPHB/exec";

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function updateSummary(totalSum, totalHkd, totalProfit) {
      document.getElementById('summaryTotal').innerText = `¥${totalSum}`;
      document.getElementById('summaryHkd').innerText = `$${totalHkd}`;
      document.getElementById('summaryProfit').innerText = `$${totalProfit}`;
    }

    async function loadData() {
      currentMonth = document.getElementById('monthSelect').value;
      if (!currentMonth) return;

      const tbody = document.querySelector("#dataTable tbody");
      tbody.innerHTML = `<tr><td colspan="9" class="empty-row">🔄 正在讀取資料...</td></tr>`;
      updateSummary(0, 0, 0);

      try {
        const res = await fetch(webAppUrl + "?month=" + currentMonth);
        const result = await res.json();

        if (result.success && Array.isArray(result.data)) {
          localDataCached = result.data;
          renderInterface();
        } else {
          localDataCached = [];
          tbody.innerHTML = `<tr><td colspan="9" class="empty-row">📅 本月無資料紀錄</td></tr>`;
          updateSummary(0, 0, 0);
        }
      } catch (error) {
        console.error("讀取失敗:", error);
        localDataCached = [];
        tbody.innerHTML = `<tr><td colspan="9" class="empty-row">讀取失敗</td></tr>`;
        updateSummary(0, 0, 0);
      }
    }

    function renderInterface() {
      const tbody = document.querySelector("#dataTable tbody");
      tbody.innerHTML = "";

      let totalSum = 0;
      let totalHkd = 0;
      let totalProfit = 0;

      if (!localDataCached.length) {
        tbody.innerHTML = `<tr><td colspan="9" class="empty-row">📅 本月無資料紀錄</td></tr>`;
        updateSummary(0, 0, 0);
        return;
      }

      localDataCached.forEach((item, index) => {
        const date = escapeHtml(item.date || '');
        const name = escapeHtml(item.name || '');
        const price = Number(item.price) || 0;
        const qty = Number(item.qty) || 0;
        const cost = Number(item.cost) || 0;
        const total = price * qty;
        const hkd = qty * cost;
        const profit = total - hkd;

        totalSum += total;
        totalHkd += hkd;
        totalProfit += profit;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td data-label="日期"><input type="text" value="${date}" onchange="updateField(${index}, 'date', this.value)"></td>
          <td data-label="貨名"><input type="text" value="${name}" onchange="updateField(${index}, 'name', this.value)"></td>
          <td data-label="價錢"><input type="number" value="${price}" onchange="updateField(${index}, 'price', this.value)"></td>
          <td data-label="數量"><input type="number" value="${qty}" onchange="updateField(${index}, 'qty', this.value)"></td>
          <td data-label="總數" class="calculated">¥${total}</td>
          <td data-label="成本"><input type="number" value="${cost}" onchange="updateField(${index}, 'cost', this.value)"></td>
          <td data-label="港幣" class="calculated">$${hkd}</td>
          <td data-label="賺取" class="calculated profit">$${profit}</td>
          <td data-label="操作" style="text-align:center;"><button class="delete-btn" onclick="deleteRecord(${item.row})">刪除</button></td>
        `;
        tbody.appendChild(tr);
      });

      updateSummary(totalSum, totalHkd, totalProfit);
    }

    function updateField(dataIndex, field, value) {
      const item = localDataCached[dataIndex];
      item[field] = value;
      renderInterface();

      const statusEl = document.getElementById("savingStatus");
      statusEl.innerText = "💾 自動儲存中...";
      statusEl.style.display = "block";

      fetch(webAppUrl + "?action=update&row=" + item.row + "&field=" + field + "&value=" + encodeURIComponent(value), {
        method: 'POST',
        mode: 'no-cors'
      })
      .then(() => {
        setTimeout(() => { statusEl.style.display = "none"; }, 800);
      })
      .catch(err => {
        console.error("同步失敗:", err);
        statusEl.innerText = "❌ 儲存失敗";
      });
    }

    function addRow() {
      const date = prompt("請輸入日期 (例如 May-26)", "May-26");
      const name = prompt("請輸入貨名");
      const price = parseFloat(prompt("價錢"));
      const qty = parseFloat(prompt("數量"));
      const cost = parseFloat(prompt("成本"));

      if (date && name && !isNaN(price) && !isNaN(qty) && !isNaN(cost)) {
        fetch(webAppUrl, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({ date, name, price, qty, cost, month: currentMonth }),
          headers: { "Content-Type": "text/plain" }
        })
        .then(() => loadData())
        .catch(err => alert("儲存失敗：" + err));
      } else {
        alert("請完整輸入資料");
      }
    }

    function deleteRecord(row) {
      if (confirm("確定要刪除這筆資料嗎？")) {
        fetch(webAppUrl + "?action=delete&row=" + row, { method: 'POST' })
          .then(() => loadData());
      }
    }

    function openSheet() {
      window.open('https://docs.google.com/spreadsheets/d/1yApB5X49TBWWXnYQmVJVCgHGW8cpax43U43rCGgkBHg/edit?pli=1&gid=0#gid=0', '_blank');
    }

    window.onload = () => {
      const today = new Date();
      currentMonth = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0');
      document.getElementById('monthSelect').value = currentMonth;
      loadData();
    };
  </script>
</body>
</html>
