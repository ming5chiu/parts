<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>每月零件紀錄</title>
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png" />

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2d3d;
      --muted: #6b7c93;
      --line: #e6ebf2;
      --accent: #2d8cff;
      --shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
      --topbar-h: 118px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: calc(var(--topbar-h) + env(safe-area-inset-top, 0px) + 10px) 8px 10px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .topbar {
      position: fixed;
      left: 0;
      right: 0;
      top: env(safe-area-inset-top, 0px);
      z-index: 1000;
      padding: 6px 8px 8px;
      background: rgba(245, 247, 251, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .summary {
      background: linear-gradient(180deg, #fff, #f8fbff);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 6px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .metric {
      background: #f7f9fc;
      border: 1px solid #e7edf4;
      border-radius: 12px;
      padding: 7px 8px;
      min-height: 46px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .metric .label {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      line-height: 1;
      margin-bottom: 3px;
    }

    .metric .value {
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .controls select,
    .controls button {
      min-height: 38px;
      border: 1px solid #d6dde7;
      background: #fff;
      border-radius: 10px;
      font-size: 13px;
      padding: 8px 10px;
      color: var(--text);
      -webkit-appearance: none;
    }

    .controls select {
      flex: 1;
      min-width: 0;
    }

    .controls button {
      font-weight: 700;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .controls .secondary {
      background: #eef3f8;
    }

    .controls .primary {
      background: #eaf2ff;
      border-color: #cfe0ff;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    .table-wrap {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead th {
      position: sticky;
      top: calc(env(safe-area-inset-top, 0px) + var(--topbar-h));
      background: #f7f9fc;
      z-index: 2;
      padding: 8px 6px;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      text-align: left;
    }

    tbody td {
      padding: 7px 6px;
      border-bottom: 1px solid #eef2f6;
      vertical-align: middle;
      overflow: hidden;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    td input {
      width: 100%;
      min-width: 0;
      border: 1px solid #d9e2eb;
      border-radius: 9px;
      padding: 6px 7px;
      font-size: 12px;
      line-height: 1;
      background: #fbfdff;
      color: var(--text);
      min-height: 32px;
      outline: none;
    }

    td input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(45, 140, 255, 0.12);
    }

    .col-index {
      width: 42px;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
    }

    .col-item { width: 34%; }
    .col-qty { width: 12%; }
    .col-hkd { width: 12%; }
    .col-gain { width: 12%; }
    .col-note { width: 22%; }
    .col-actions { width: 84px; }

    .delete-btn {
      width: 100%;
      min-height: 32px;
      border: none;
      border-radius: 9px;
      background: #ffecec;
      color: #c0392b;
      font-size: 12px;
      font-weight: 800;
      padding: 0 6px;
    }

    .delete-btn:active {
      transform: translateY(1px);
    }

    .empty {
      padding: 18px 10px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .saving-status {
      position: fixed;
      right: 8px;
      bottom: 8px;
      z-index: 1001;
      background: rgba(31, 45, 61, 0.9);
      color: #fff;
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 11px;
      box-shadow: var(--shadow);
      pointer-events: none;
    }

    @media (max-width: 820px) {
      :root {
        --topbar-h: 112px;
      }

      body {
        padding: calc(var(--topbar-h) + env(safe-area-inset-top, 0px) + 6px) 6px 8px;
      }

      h1 {
        display: none;
      }

      .topbar {
        padding: 5px 6px 6px;
      }

      .summary {
        padding: 5px;
        border-radius: 12px;
      }

      .metrics {
        gap: 4px;
      }

      .metric {
        min-height: 40px;
        padding: 5px 6px;
        border-radius: 10px;
      }

      .metric .label {
        font-size: 9px;
        margin-bottom: 2px;
      }

      .metric .value {
        font-size: 12px;
      }

      .controls {
        gap: 4px;
        margin-top: 5px;
      }

      .controls select,
      .controls button {
        min-height: 34px;
        font-size: 12px;
        padding: 6px 8px;
        border-radius: 9px;
      }

      .controls select {
        flex: 1 1 100%;
      }

      .controls .secondary,
      .controls .primary {
        flex: 1 1 calc(50% - 2px);
      }

      .table-wrap {
        border-radius: 12px;
      }

      thead th {
        padding: 6px 4px;
        font-size: 10px;
      }

      tbody td {
        padding: 5px 4px;
      }

      td input {
        min-height: 28px;
        padding: 4px 5px;
        font-size: 11px;
        border-radius: 8px;
      }

      .col-index {
        width: 0;
        display: none;
      }

      .col-item { width: 38%; }
      .col-qty { width: 12%; }
      .col-hkd { width: 12%; }
      .col-gain { width: 12%; }
      .col-note { width: 20%; }
      .col-actions { width: 58px; }

      .delete-btn {
        min-height: 28px;
        font-size: 10px;
        border-radius: 8px;
      }

      .saving-status {
        right: 6px;
        bottom: 6px;
        font-size: 10px;
        padding: 5px 8px;
      }
    }
  </style>
</head>

<body>
  <h1>每月零件紀錄</h1>

  <div class="topbar">
    <div class="summary">
      <div class="metrics">
        <div class="metric">
          <div class="label">總數</div>
          <div class="value" id="totalQty">0</div>
        </div>
        <div class="metric">
          <div class="label">港幣</div>
          <div class="value" id="totalHKD">HK$0</div>
        </div>
        <div class="metric">
          <div class="label">賺取</div>
          <div class="value" id="totalGain">HK$0</div>
        </div>
      </div>

      <div class="controls">
        <select id="monthSelect"></select>
        <button class="secondary" type="button" id="addBtn">➕ 新增項目</button>
        <button class="primary" type="button" id="sheetBtn">📊 開啟 Google Sheet</button>
      </div>
    </div>
  </div>

  <main>
    <div class="table-wrap">
      <table>
        <colgroup>
          <col class="col-index" />
          <col class="col-item" />
          <col class="col-qty" />
          <col class="col-hkd" />
          <col class="col-gain" />
          <col class="col-note" />
          <col class="col-actions" />
        </colgroup>
        <thead>
          <tr>
            <th class="col-index">#</th>
            <th class="col-item">項目</th>
            <th class="col-qty">數量</th>
            <th class="col-hkd">港幣</th>
            <th class="col-gain">賺取</th>
            <th class="col-note">備註</th>
            <th class="col-actions">操作</th>
          </tr>
        </thead>
        <tbody id="recordsBody"></tbody>
      </table>
    </div>
  </main>

  <div class="saving-status" id="savingStatus">💾 自動儲存中...</div>

  <script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbz5q4zQLBg16QKrbBU1q7I5QwVyRUwMKX6k3CCa3mqGLRotnG9OWVSt6Z8L2ZUpxPHB/exec";
    const sheetUrl = "https://docs.google.com/spreadsheets/d/1yApB5X49TBWWXnYQmVJVCgHGW8cpax43U43rCGgkBHg/edit?pli=1&gid=0#gid=0";
    const storagePrefix = "parts-records-";

    let currentMonth = "";
    let localDataCached = [];
    let saveTimer = null;

    const $ = (id) => document.getElementById(id);

    function uid() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return String(Date.now()) + "-" + Math.random().toString(16).slice(2);
    }

    function thisMonthKey() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function normalizeNumber(value) {
      const raw = String(value ?? "").replace(/[,￥$HKhK\s]/g, "");
      const n = Number(raw);
      return Number.isFinite(n) ? n : 0;
    }

    function formatAmount(value) {
      const n = normalizeNumber(value);
      if (Number.isInteger(n)) return n.toLocaleString("zh-HK");
      return n.toLocaleString("zh-HK", { maximumFractionDigits: 2 });
    }

    function storageKey(month) {
      return storagePrefix + month;
    }

    function setSaving(text) {
      $("savingStatus").textContent = text;
    }

    function newRow() {
      return {
        id: uid(),
        item: "",
        qty: "",
        hkd: "",
        gain: "",
        note: ""
      };
    }

    function normalizeRow(row) {
      return {
        id: row?.id || uid(),
        item: row?.item ?? row?.name ?? "",
        qty: row?.qty ?? row?.quantity ?? "",
        hkd: row?.hkd ?? row?.hkdAmount ?? "",
        gain: row?.gain ?? row?.profit ?? "",
        note: row?.note ?? ""
      };
    }

    function normalizeRows(rows) {
      if (!Array.isArray(rows)) return [];
      return rows.map(normalizeRow);
    }

    function monthOptions() {
      const select = $("monthSelect");
      const base = new Date();
      base.setDate(1);
      const frag = document.createDocumentFragment();

      for (let i = -24; i <= 12; i++) {
        const d = new Date(base);
        d.setMonth(d.getMonth() + i);
        const value = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        frag.appendChild(option);
      }

      select.innerHTML = "";
      select.appendChild(frag);
      select.value = currentMonth;
    }

    function loadFromLocal(month) {
      try {
        const raw = localStorage.getItem(storageKey(month));
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return normalizeRows(parsed);
      } catch {
        return [];
      }
    }

    function saveToLocal() {
      try {
        localStorage.setItem(storageKey(currentMonth), JSON.stringify(localDataCached));
      } catch {}
    }

    function updateSummary() {
      const totalQty = localDataCached.reduce((sum, row) => sum + normalizeNumber(row.qty), 0);
      const totalHKD = localDataCached.reduce((sum, row) => sum + normalizeNumber(row.hkd), 0);
      const totalGain = localDataCached.reduce((sum, row) => sum + normalizeNumber(row.gain), 0);

      $("totalQty").textContent = formatAmount(totalQty);
      $("totalHKD").textContent = "HK$" + formatAmount(totalHKD);
      $("totalGain").textContent = "HK$" + formatAmount(totalGain);
    }

    function renderTable() {
      const body = $("recordsBody");
      if (!localDataCached.length) {
        body.innerHTML = `
          <tr>
            <td class="empty" colspan="7">未有資料，撳「➕ 新增項目」開始</td>
          </tr>
        `;
        updateSummary();
        return;
      }

      body.innerHTML = localDataCached.map((row, index) => `
        <tr data-id="${escapeHtml(row.id)}">
          <td class="col-index">${index + 1}</td>
          <td class="col-item">
            <input data-id="${escapeHtml(row.id)}" data-field="item" type="text" value="${escapeHtml(row.item)}" placeholder="項目" />
          </td>
          <td class="col-qty">
            <input data-id="${escapeHtml(row.id)}" data-field="qty" type="number" inputmode="numeric" step="1" value="${escapeHtml(row.qty)}" placeholder="0" />
          </td>
          <td class="col-hkd">
            <input data-id="${escapeHtml(row.id)}" data-field="hkd" type="number" inputmode="decimal" step="0.01" value="${escapeHtml(row.hkd)}" placeholder="0" />
          </td>
          <td class="col-gain">
            <input data-id="${escapeHtml(row.id)}" data-field="gain" type="number" inputmode="decimal" step="0.01" value="${escapeHtml(row.gain)}" placeholder="0" />
          </td>
          <td class="col-note">
            <input data-id="${escapeHtml(row.id)}" data-field="note" type="text" value="${escapeHtml(row.note)}" placeholder="備註" />
          </td>
          <td class="col-actions">
            <button class="delete-btn" type="button" data-delete-id="${escapeHtml(row.id)}">刪除</button>
          </td>
        </tr>
      `).join("");

      body.querySelectorAll("input").forEach((input) => {
        input.addEventListener("input", onFieldChange);
      });

      body.querySelectorAll("[data-delete-id]").forEach((btn) => {
        btn.addEventListener("click", () => deleteRecord(btn.dataset.deleteId));
      });

      updateSummary();
    }

    function onFieldChange(event) {
      const input = event.target;
      const id = input.dataset.id;
      const field = input.dataset.field;
      const row = localDataCached.find((r) => r.id === id);
      if (!row) return;
      row[field] = input.value;
      updateSummary();
      scheduleSave();
    }

    function scheduleSave() {
      setSaving("💾 儲存中...");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        saveData(true);
      }, 500);
    }

    async function loadData() {
      currentMonth = $("monthSelect").value || thisMonthKey();
      $("monthSelect").value = currentMonth;
      setSaving("載入中...");

      const localFallback = loadFromLocal(currentMonth);

      try {
        const res = await fetch(`${webAppUrl}?action=get&month=${encodeURIComponent(currentMonth)}`, {
          headers: { Accept: "application/json" }
        });

        const text = await res.text();
        let payload = null;

        try {
          payload = JSON.parse(text);
        } catch {
          payload = text;
        }

        let rows = [];
        if (Array.isArray(payload)) rows = payload;
        else if (payload && Array.isArray(payload.records)) rows = payload.records;
        else if (payload && Array.isArray(payload.data)) rows = payload.data;

        localDataCached = normalizeRows(rows.length ? rows : localFallback);
        if (!localDataCached.length) localDataCached = [];
        renderTable();
        saveToLocal();
        setSaving("已載入");
      } catch {
        localDataCached = localFallback;
        renderTable();
        setSaving("已載入本機備份");
      }
    }

    async function saveData(silent = false) {
      saveToLocal();

      try {
        const body = new URLSearchParams();
        body.set("action", "save");
        body.set("month", currentMonth);
        body.set("data", JSON.stringify(localDataCached));

        await fetch(webAppUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
          },
          body
        });

        if (!silent) setSaving("已儲存");
        else setSaving("已自動儲存");
      } catch {
        if (!silent) setSaving("已儲存本機");
        else setSaving("已自動儲存本機");
      }
    }

    function addRecord() {
      localDataCached.unshift(newRow());
      renderTable();
      saveData(true);
      requestAnimationFrame(() => {
        const firstInput = document.querySelector('input[data-field="item"]');
        if (firstInput) firstInput.focus();
      });
    }

    function deleteRecord(id) {
      if (!confirm("確定要刪除呢筆資料？")) return;
      localDataCached = localDataCached.filter((row) => row.id !== id);
      renderTable();
      saveData(true);
    }

    function openSheet() {
      window.open(sheetUrl, "_blank");
    }

    function buildMonthSelect() {
      currentMonth = thisMonthKey();
      monthOptions();
    }

    $("monthSelect").addEventListener("change", loadData);
    $("addBtn").addEventListener("click", addRecord);
    $("sheetBtn").addEventListener("click", openSheet);

    window.addEventListener("beforeunload", saveToLocal);

    buildMonthSelect();
    loadData();
  </script>
</body>
</html>
