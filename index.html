<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f2f2f7" />
  <title>每月零件紀錄</title>
  <style>
    :root {
      --bg: #f2f2f7;
      --card: rgba(255, 255, 255, 0.82);
      --card-solid: #ffffff;
      --text: #1c1c1e;
      --muted: #6c6c70;
      --line: rgba(60, 60, 67, 0.12);
      --accent: #007aff;
      --good: #34c759;
      --danger: #ff3b30;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      --topbar-h: 118px;
      --safe-top: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
    body { padding: calc(var(--topbar-h) + var(--safe-top) + 12px) 10px 12px; }
    h1 { margin: 0 0 10px; text-align: center; font-size: 20px; font-weight: 700; }
    .topbar { position: fixed; left: 0; right: 0; top: var(--safe-top); z-index: 1000; padding: 8px 10px 10px; background: rgba(242, 242, 247, 0.88); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-bottom: 1px solid var(--line); }
    .summary { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 10px; }
    .summary-title { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .summary-item { border: 1px solid rgba(60, 60, 67, 0.08); border-radius: 14px; padding: 8px 10px; min-height: 56px; display: flex; flex-direction: column; justify-content: center; }
    .summary-item span { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 3px; }
    .summary-item strong { font-size: 18px; font-weight: 700; }
    .summary-item.total { background: rgba(0, 122, 255, 0.08); } .summary-item.total strong { color: var(--accent); }
    .summary-item.hkd { background: rgba(255, 149, 0, 0.10); } .summary-item.hkd strong { color: #ff9500; }
    .summary-item.profit { background: rgba(52, 199, 89, 0.10); } .summary-item.profit strong { color: var(--good); }
    .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .controls input[type="month"], .controls button { width: 100%; min-height: 46px; border-radius: 14px; border: 1px solid rgba(60, 60, 67, 0.14); font-size: 16px; padding: 10px 14px; background: var(--card-solid); color: var(--text); }
    .action-row { display: flex; gap: 10px; }
    .action-row button { flex: 1; font-weight: 600; background: rgba(0, 122, 255, 0.08); color: var(--accent); border-color: rgba(0, 122, 255, 0.14); }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; min-width: 780px; border-collapse: collapse; background: var(--card-solid); border-radius: 18px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); }
    thead th { background: #f7f7fb; color: var(--muted); padding: 12px 8px; font-size: 13px; font-weight: 700; border-bottom: 1px solid var(--line); }
    td { padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 15px; text-align: right; background: #fff; }
    th:nth-child(2), td:nth-child(2) { text-align: left; padding-left: 10px; }
    input[type="text"], input[type="number"] { width: 100%; border: 1px solid transparent; background: transparent; padding: 8px; font-size: 16px; color: var(--text); text-align: right; outline: none; }
    td:nth-child(2) input[type="text"] { text-align: left; }
    .calculated { font-weight: 700; }
    .rmb-cell { background: rgba(0, 122, 255, 0.08); color: var(--accent); }
    .cost-cell { background: rgba(255, 149, 0, 0.10); color: #ff9500; }
    .profit-cell { background: rgba(52, 199, 89, 0.10); color: var(--good); }
    .delete-btn { background: rgba(255, 59, 48, 0.1); color: var(--danger); border: 1px solid rgba(255, 59, 48, 0.14); padding: 7px 11px; border-radius: 10px; font-size: 14px; font-weight: 600; }
    .saving-status { position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; background: rgba(28, 28, 30, 0.9); color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 13px; display: none; z-index: 999; }
    .empty-row { text-align: center; padding: 24px !important; color: var(--muted); }

    @media (max-width: 820px) {
      :root { --topbar-h: 108px; }
      body { padding-left: 8px; padding-right: 8px; }
      thead { display: none; }
      tbody, tr, td { display: block; width: 100%; }
      tr { margin-bottom: 8px; background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
      td { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid rgba(60, 60, 67, 0.08); font-size: 12px; }
      td::before { content: attr(data-label); font-weight: 700; color: var(--muted); min-width: 65px; }
      input[type="text"], input[type="number"] { background: #f7f7fb; border: 1px solid rgba(60, 60, 67, 0.12); border-radius: 9px; padding: 5px 7px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="summary">
      <div class="summary-title">本月總覽</div>
      <div class="summary-grid">
        <div class="summary-item total"><span>人民幣</span><strong id="summaryTotal">¥0</strong></div>
        <div class="summary-item hkd"><span>成本人民幣</span><strong id="summaryHkd">¥0</strong></div>
        <div class="summary-item profit"><span>賺取(港幣)</span><strong id="summaryProfit">$0</strong></div>
      </div>
    </div>
  </div>

  <h1>每月零件紀錄表</h1>

  <div class="controls">
    <input type="month" id="monthSelect" onchange="loadData()" />
    <div class="action-row">
      <button onclick="addRow()">➕ 新增項目</button>
      <button onclick="openSheet()">📊 開啟 Google Sheet</button>
    </div>
  </div>

  <div class="table-wrap">
    <table id="dataTable">
      <thead>
        <tr>
          <th>日期</th>
          <th>貨名</th>
          <th>價錢</th>
          <th>數量</th>
          <th>人民幣</th>
          <th>成本</th>
          <th>成本人民幣</th>
          <th>賺取(港幣)</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="savingStatus" class="saving-status">💾 自動儲存中...</div>

  <script>
    let localDataCached = [];
    let currentMonthPrefix = ""; // 例如 "Jun"
    let currentMonthFull = "";   // 例如 "Jun-26"
    const webAppUrl = "https://script.google.com/macros/s/AKfycbz5q4zQLBg16QKrbBU1q7I5QwVyRUwMKX6k3CCa3mqGLRotnG9OWVSt6Z8L2ZUpxPHB/exec";
    const exchangeRate = 1.1;

    // 解析選取的月份，轉換成 "Jun" 的開頭標籤
    function parseSelectedMonth() {
      const rawMonth = document.getElementById("monthSelect").value;
      if (!rawMonth) return;
      const [year, month] = rawMonth.split("-");
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      currentMonthPrefix = months[parseInt(month, 10) - 1]; // "Jun"
      currentMonthFull = `${currentMonthPrefix}-${year.substring(2)}`; // "Jun-26"
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function formatMoney(value) {
      const n = Number(value) || 0;
      return n.toFixed(2).replace(/\.?0+$/, "");
    }

    function updateSummary(totalSum, totalCost, totalProfit) {
      document.getElementById("summaryTotal").innerText = `¥${formatMoney(totalSum)}`;
      document.getElementById("summaryHkd").innerText = `¥${formatMoney(totalCost)}`;
      document.getElementById("summaryProfit").innerText = `$${formatMoney(totalProfit)}`;
    }

    // 🌟 核心修改：直接將 "Jun" 當作參數傳給後端進行過濾查詢
    async function loadData() {
      parseSelectedMonth();
      if (!currentMonthPrefix) return;

      const tbody = document.querySelector("#dataTable tbody");
      tbody.innerHTML = `<tr><td colspan="9" class="empty-row">🔄 正在讀取 ${currentMonthFull} 的資料...</td></tr>`;
      updateSummary(0, 0, 0);

      try {
        // 帶上過濾參數 monthPrefix=Jun
        const res = await fetch(webAppUrl + "?monthPrefix=" + encodeURIComponent(currentMonthPrefix));
        const result = await res.json();

        if (result.success && Array.isArray(result.data) && result.data.length > 0) {
          localDataCached = result.data;
          renderInterface();
        } else {
          localDataCached = [];
          tbody.innerHTML = `<tr><td colspan="9" class="empty-row">📅 ${currentMonthFull} 無符合的日期紀錄</td></tr>`;
        }
      } catch (error) {
        console.error("讀取失敗:", error);
        tbody.innerHTML = `<tr><td colspan="9" class="empty-row">❌ 讀取失敗</td></tr>`;
      }
    }

    function renderInterface() {
      const tbody = document.querySelector("#dataTable tbody");
      tbody.innerHTML = "";

      let totalSum = 0; let totalCost = 0; let totalProfit = 0;

      localDataCached.forEach((item, index) => {
        const date = escapeHtml(item.date || "");
        const name = escapeHtml(item.name || "");
        const price = Number(item.price) || 0;
        const qty = Number(item.qty) || 0;
        const cost = Number(item.cost) || 0;

        const totalRmb = price * qty;
        const costRmb = cost * qty;
        const profitHkd = (totalRmb - costRmb) * exchangeRate;

        totalSum += totalRmb;
        totalCost += costRmb;
        totalProfit += profitHkd;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td data-label="日期"><input type="text" value="${date}" onchange="updateField(${index}, 'date', this.value)"></td>
          <td data-label="貨名"><input type="text" value="${name}" onchange="updateField(${index}, 'name', this.value)"></td>
          <td data-label="價錢"><input type="number" value="${price}" onchange="updateField(${index}, 'price', this.value)"></td>
          <td data-label="數量"><input type="number" value="${qty}" onchange="updateField(${index}, 'qty', this.value)"></td>
          <td data-label="人民幣" class="calculated rmb-cell">¥${formatMoney(totalRmb)}</td>
          <td data-label="成本"><input type="number" value="${cost}" onchange="updateField(${index}, 'cost', this.value)"></td>
          <td data-label="成本人民幣" class="calculated cost-cell">¥${formatMoney(costRmb)}</td>
          <td data-label="賺取(港幣)" class="calculated profit-cell">$${formatMoney(profitHkd)}</td>
          <td data-label="操作" style="text-align:center;"><button class="delete-btn" onclick="deleteRecord(${item.row})">刪除</button></td>
        `;
        tbody.appendChild(tr);
      });

      updateSummary(totalSum, totalCost, totalProfit);
    }

    function updateField(dataIndex, field, value) {
      const item = localDataCached[dataIndex];
      item[field] = value;
      renderInterface();

      const statusEl = document.getElementById("savingStatus");
      statusEl.innerText = "💾 自動儲存中...";
      statusEl.style.display = "block";

      fetch(webAppUrl + "?action=update&row=" + item.row + "&field=" + field + "&value=" + encodeURIComponent(value), {
        method: "POST",
        mode: "no-cors"
      })
      .then(() => { setTimeout(() => { statusEl.style.display = "none"; }, 800); })
      .catch(err => { statusEl.innerText = "❌ 儲存失敗"; });
    }

    function addRow() {
      const today = new Date();
      const defaultDateStr = `${currentMonthPrefix}-${today.getDate()}`; // 預設產生如 "Jun-23"
      
      const date = prompt(`請輸入日期 (將依此字串分類月份)`, defaultDateStr);
      const name = prompt("請輸入貨名");
      const price = parseFloat(prompt("價錢"));
      const qty = parseFloat(prompt("數量"));
      const cost = parseFloat(prompt("成本"));

      if (date && name && !isNaN(price) && !isNaN(qty) && !isNaN(cost)) {
        fetch(webAppUrl, {
          method: "POST",
          mode: "no-cors",
          body: JSON.stringify({ date, name, price, qty, cost }),
          headers: { "Content-Type": "text/plain" }
        })
        .then(() => loadData())
        .catch(err => alert("儲存失敗：" + err));
      } else {
        alert("請完整輸入資料");
      }
    }

    function deleteRecord(row) {
      if (confirm("確定要刪除這筆資料嗎？")) {
        fetch(webAppUrl + "?action=delete&row=" + row, { method: "POST" }).then(() => loadData());
      }
    }

    function openSheet() {
      window.open("https://docs.google.com/spreadsheets/d/1yApB5X49TBWWXnYQmVJVCgHGW8cpax43U43rCGgkBHg/edit?pli=1&gid=0#gid=0", "_blank");
    }

    window.onload = () => {
      const today = new Date();
      today.setMonth(today.getMonth() + 1); // 預設強制跳到 6 月方便提早記帳
      const currentActualMonth = today.getMonth() + 1; 
      const initRawMonth = today.getFullYear() + "-" + String(currentActualMonth).padStart(2, "0");
      document.getElementById("monthSelect").value = initRawMonth;
      loadData();
    };
  </script>
</body>
</html>
