<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每月進銷存</title>
  <style>
    body { font-family: "Microsoft JhengHei", sans-serif; background: #f4f6f9; padding: 15px; }
    h1 { text-align: center; }
    .controls { text-align: center; margin: 15px 0; }
    button { padding: 12px 16px; margin: 5px; font-size: 16px; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th { background: #2c3e50; color: white; padding: 10px; }
    td { padding: 10px; border-bottom: 1px solid #ddd; text-align: right; }
    input { width: 100%; border: none; text-align: right; font-size: 16px; }
    .calculated { background: #e8f4fc; font-weight: bold; }
    .profit { background: #d4f4e0; font-weight: bold; color: #1e8449; }
  </style>
</head>
<body>
  <h1>每月進銷存統計表</h1>
  
  <div class="controls">
    <input type="month" id="month" onchange="loadData()">
    <button onclick="addRow()">➕ 新增項目</button>
    <button onclick="window.open('https://docs.google.com/spreadsheets/d/1iopGpVm1T29kLOxIHwYWmhXAN-qDfohVc1qfWEJhM1U/edit?gid=0#gid=0')">📊 開啟 Google Sheet</button>
  </div>

  <table id="table">
    <thead>
      <tr>
        <th>日期</th>
        <th>貨名</th>
        <th>價錢</th>
        <th>數量</th>
        <th>總數</th>
        <th>成本</th>
        <th>港幣</th>
        <th>賺取</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
  let currentMonth = '';

  function getWebAppUrl() {
    return "你的Web App URL";   // ← 部署後貼在這裡
  }

  async function loadData() {
    currentMonth = document.getElementById('month').value;
    const res = await fetch(getWebAppUrl() + '?month=' + currentMonth);
    const data = await res.json();
    
    const tbody = document.querySelector('#table tbody');
    tbody.innerHTML = '';
    
    data.forEach(item => {
      const total = Math.round(item.price * item.qty);
      const hkd = Math.round(item.qty * item.cost);
      const profit = total - hkd;
      
      const row = document.createElement('tr');
      row.innerHTML = `
        <td><input value="${item.date}" onchange="updateCell(${item.row}, 'date', this)"></td>
        <td><input value="${item.name}" onchange="updateCell(${item.row}, 'name', this)"></td>
        <td><input type="number" value="${item.price}" onchange="updateCell(${item.row}, 'price', this)"></td>
        <td><input type="number" value="${item.qty}" onchange="updateCell(${item.row}, 'qty', this)"></td>
        <td class="calculated">¥${total}</td>
        <td><input type="number" value="${item.cost}" onchange="updateCell(${item.row}, 'cost', this)"></td>
        <td class="calculated">$${hkd}</td>
        <td class="calculated profit">$${profit}</td>
        <td><button onclick="deleteRow(${item.row})">刪除</button></td>
      `;
      tbody.appendChild(row);
    });
  }

  // 其他功能（addRow, updateCell, deleteRow）我會在你確認後補上

  window.onload = () => {
    const today = new Date();
    currentMonth = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0');
    document.getElementById('month').value = currentMonth;
    loadData();
  };
</script>
</body>
</html>
