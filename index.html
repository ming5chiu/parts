<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>每月零件紀錄</title>
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png" />
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2d3d;
      --muted: #6b7c93;
      --line: #e6ebf2;
      --shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
      --topbar-h: 118px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: calc(var(--topbar-h) + env(safe-area-inset-top, 0px) + 10px) 8px 10px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .topbar {
      position: fixed;
      left: 0;
      right: 0;
      top: env(safe-area-inset-top, 0px);
      z-index: 1000;
      padding: 6px 8px 8px;
      background: rgba(245, 247, 251, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .summary {
      background: linear-gradient(180deg, #fff, #f8fbff);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 6px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .metric {
      position: relative;
      background: #f7f9fc;
      border: 1px solid #e7edf4;
      border-top: 3px solid var(--accent);
      border-radius: 12px;
      padding: 7px 8px;
      min-height: 46px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .metric.total { --accent: #2563eb; }
    .metric.hk { --accent: #d97706; }
    .metric.earn { --accent: #16a34a; }

    .metric .label {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 3px;
    }

    .metric .value {
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: grid;
      grid-template-columns: 1.15fr .9fr .95fr;
      gap: 6px;
      margin-top: 6px;
    }

    .controls select,
    .controls button {
      min-height: 38px;
      border: 1px solid #d6dde7;
      background: #fff;
      border-radius: 10px;
      font-size: 13px;
      padding: 8px 10px;
      color: var(--text);
      -webkit-appearance: none;
      appearance: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls select {
      min-width: 0;
      width: 100%;
    }

    .controls button {
      font-weight: 700;
    }

    .controls .secondary {
      background: #eef3f8;
    }

    .controls .primary {
      background: #eaf2ff;
    }

    .table-wrap {
      margin-top: 10px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f8fbff;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      padding: 7px 5px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    tbody td {
      padding: 4px;
      border-bottom: 1px solid #edf1f6;
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    th:nth-child(1), td:nth-child(1) { width: 38%; }
    th:nth-child(2), td:nth-child(2) { width: 11%; }
    th:nth-child(3), td:nth-child(3) { width: 11%; }
    th:nth-child(4), td:nth-child(4) { width: 11%; }
    th:nth-child(5), td:nth-child(5) { width: 21%; }
    th:nth-child(6), td:nth-child(6) { width: 8%; }

    .cell {
      width: 100%;
      min-width: 0;
      height: 30px;
      border: 1px solid #dce3ec;
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 12px;
      padding: 0 8px;
      outline: none;
    }

    .cell:focus {
      border-color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .delete-btn {
      width: 100%;
      min-height: 30px;
      border: 1px solid #fecdd3;
      border-radius: 8px;
      background: #fff1f2;
      color: #e11d48;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .delete-btn:active {
      background: #ffe4e6;
    }

    .empty {
      padding: 14px 10px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .status {
      margin-top: 8px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 820px) {
      :root {
        --topbar-h: 102px;
      }

      body {
        padding: calc(var(--topbar-h) + env(safe-area-inset-top, 0px) + 8px) 6px 8px;
      }

      h1 {
        font-size: 15px;
        margin: 0 0 6px;
      }

      .summary {
        padding: 5px;
        border-radius: 12px;
      }

      .metrics {
        gap: 5px;
      }

      .metric {
        min-height: 40px;
        padding: 5px 6px;
        border-radius: 10px;
      }

      .metric .label {
        font-size: 9px;
        margin-bottom: 2px;
      }

      .metric .value {
        font-size: 12px;
      }

      .controls {
        gap: 5px;
        margin-top: 5px;
      }

      .controls select,
      .controls button {
        min-height: 34px;
        font-size: 12px;
        padding: 7px 8px;
        border-radius: 9px;
      }

      .table-wrap {
        margin-top: 8px;
        border-radius: 12px;
      }

      table {
        min-width: 700px;
      }

      thead th {
        font-size: 10px;
        padding: 6px 4px;
      }

      tbody td {
        padding: 3px;
      }

      .cell,
      .delete-btn {
        height: 28px;
        font-size: 11px;
        border-radius: 7px;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>每月零件紀錄</h1>
    <div class="summary">
      <div class="metrics">
        <div class="metric total">
          <div class="label">總數</div>
          <div class="value" id="totalQty">0</div>
        </div>
        <div class="metric hk">
          <div class="label">港幣</div>
          <div class="value" id="totalHkd">HK$0</div>
        </div>
        <div class="metric earn">
          <div class="label">賺取</div>
          <div class="value" id="totalEarn">HK$0</div>
        </div>
      </div>
      <div class="controls">
        <select id="monthSelect"></select>
        <button class="secondary" type="button" onclick="addRecord()">➕ 新增項目</button>
        <button class="primary" type="button" onclick="openSheet()">📊 開啟 Google Sheet</button>
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>項目</th>
          <th>數量</th>
          <th>港幣</th>
          <th>賺取</th>
          <th>備註</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="recordsBody"></tbody>
    </table>
  </div>

  <div class="status" id="savingStatus">💾 自動儲存中...</div>

  <script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbz5q4zQLBg16QKrbBU1q7I5QwVyRUwMKX6k3CCa3mqGLRotnG9OWVSt6Z8L2ZUpxPHB/exec";
    const sheetUrl = "https://docs.google.com/spreadsheets/d/1yApB5X49TBWWXnYQmVJVCgHGW8cpax43U43rCGgkBHg/edit?pli=1&gid=0#gid=0";

    const monthSelect = document.getElementById("monthSelect");
    const recordsBody = document.getElementById("recordsBody");
    const totalQtyEl = document.getElementById("totalQty");
    const totalHkdEl = document.getElementById("totalHkd");
    const totalEarnEl = document.getElementById("totalEarn");
    const savingStatus = document.getElementById("savingStatus");

    let currentMonth = "";
    let rows = [];
    let saveTimer = null;

    function todayMonth() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function toNumber(value) {
      const n = parseFloat(String(value).replace(/[^\d.-]/g, ""));
      return Number.isFinite(n) ? n : 0;
    }

    function money(value) {
      return `HK$${Math.round(toNumber(value)).toLocaleString("en-HK")}`;
    }

    function makeRow(data = {}) {
      return {
        item: data.item ?? "",
        qty: data.qty ?? "",
        hkd: data.hkd ?? "",
        earn: data.earn ?? "",
        note: data.note ?? ""
      };
    }

    function storageKey(month = currentMonth) {
      return `parts-records-${month}`;
    }

    function setStatus(text) {
      savingStatus.textContent = text;
    }

    function updateMonths() {
      const value = todayMonth();
      const years = [];
      const now = new Date();
      const startYear = now.getFullYear() - 2;
      for (let y = now.getFullYear() + 1; y >= startYear; y--) {
        for (let m = 12; m >= 1; m--) {
          years.push(`${y}-${String(m).padStart(2, "0")}`);
        }
      }
      monthSelect.innerHTML = years
        .filter(v => v <= value || true)
        .map(v => `<option value="${v}">${v}</option>`)
        .join("");
      monthSelect.value = value;
    }

    function updateSummary() {
      let qty = 0;
      let hkd = 0;
      let earn = 0;

      for (const row of rows) {
        qty += toNumber(row.qty);
        hkd += toNumber(row.hkd);
        earn += toNumber(row.earn);
      }

      totalQtyEl.textContent = Math.round(qty).toLocaleString("en-HK");
      totalHkdEl.textContent = money(hkd);
      totalEarnEl.textContent = money(earn);
    }

    function render() {
      if (!rows.length) {
        recordsBody.innerHTML = `<tr><td class="empty" colspan="6">未有資料</td></tr>`;
        updateSummary();
        return;
      }

      recordsBody.innerHTML = rows.map((row, i) => `
        <tr>
          <td><input class="cell" data-i="${i}" data-f="item" value="${escapeHtml(row.item)}" placeholder="項目"></td>
          <td><input class="cell num" data-i="${i}" data-f="qty" inputmode="decimal" value="${escapeHtml(row.qty)}" placeholder="0"></td>
          <td><input class="cell num" data-i="${i}" data-f="hkd" inputmode="decimal" value="${escapeHtml(row.hkd)}" placeholder="0"></td>
          <td><input class="cell num" data-i="${i}" data-f="earn" inputmode="decimal" value="${escapeHtml(row.earn)}" placeholder="0"></td>
          <td><input class="cell" data-i="${i}" data-f="note" value="${escapeHtml(row.note)}" placeholder="備註"></td>
          <td><button class="delete-btn" data-delete="${i}" type="button">刪除</button></td>
        </tr>
      `).join("");

      updateSummary();
      bindEvents();
    }

    function bindEvents() {
      recordsBody.querySelectorAll("input").forEach(input => {
        input.oninput = (e) => {
          const i = Number(e.target.dataset.i);
          const f = e.target.dataset.f;
          rows[i][f] = e.target.value;
          updateSummary();
          scheduleSave();
        };
      });

      recordsBody.querySelectorAll("[data-delete]").forEach(btn => {
        btn.onclick = () => deleteRecord(Number(btn.dataset.delete));
      });
    }

    function scheduleSave() {
      setStatus("💾 自動儲存中...");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveAll, 500);
    }

    async function loadData() {
      currentMonth = monthSelect.value || todayMonth();
      const local = localStorage.getItem(storageKey(currentMonth));
      rows = local ? JSON.parse(local).map(makeRow) : [];

      render();
      setStatus("⏳ 讀取中...");

      try {
        const res = await fetch(`${webAppUrl}?month=${encodeURIComponent(currentMonth)}`, {
          headers: { Accept: "application/json" }
        });

        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          data = null;
        }

        if (Array.isArray(data)) {
          rows = data.map(makeRow);
        } else if (data && Array.isArray(data.rows)) {
          rows = data.rows.map(makeRow);
        } else if (data && Array.isArray(data.data)) {
          rows = data.data.map(makeRow);
        }

        if (!rows.length && local) {
          rows = JSON.parse(local).map(makeRow);
        }

        render();
        setStatus("✅ 已載入");
      } catch {
        if (!rows.length) rows = [makeRow()];
        render();
        setStatus("✅ 已載入本機資料");
      }
    }

    async function saveAll() {
      localStorage.setItem(storageKey(currentMonth), JSON.stringify(rows));
      try {
        await fetch(webAppUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            action: "save",
            month: currentMonth,
            rows
          })
        });
        setStatus("✅ 已儲存");
      } catch {
        setStatus("✅ 已儲存本機");
      }
    }

    function addRecord() {
      rows.unshift(makeRow());
      render();
      scheduleSave();
    }

    function deleteRecord(i) {
      if (!confirm("確定要刪除這筆資料嗎？")) return;
      rows.splice(i, 1);
      render();
      scheduleSave();
    }

    function openSheet() {
      window.open(sheetUrl, "_blank");
    }

    monthSelect.addEventListener("change", loadData);

    window.onload = () => {
      updateMonths();
      loadData();
    };
  </script>
</body>
</html>
